# ============================================================
# EMG emergency-service 공통 설정
# 개인 PC 오버라이드: application-local.yml
# ============================================================

server:
  port: 8089
  servlet:
    session:
      timeout: 10h
      cookie:
        http-only: true
        path: /
        same-site: lax

app:
  api:
    host: localhost
    port: ${server.port}
    base-url: http://${app.api.host}:${server.port}
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://117.16.154.233:18080
      - http://seoulit.pe.kr:18080
      - http://localhost:18080
  auth:
    # true 면 /api/emergency/** 를 로그인(Redis 세션) 없이 부를 때 401. 서버끼리 부르는 API(접수의 중복 접수 확인·접수 정보 전송)는 제외한다.
    # admin 이 만든 세션을 읽을 수 있는 환경(같은 Redis)에서 로그인한 브라우저로 확인한 뒤 켠다. 꺼 둬도 세션이 있으면 처리자 ID 는 세션의 empId 로 기록한다.
    required: ${AUTH_REQUIRED:false}
  admin:
    # admin-service 공통코드 API base-url. 공용서버 배포 기준(localhost) — 개인 PC 개발 시: http://192.168.1.128:9191
    base-url: ${ADMIN_BASE_URL:http://localhost:9191}
  patient:
    # patient-service 배치조회 base-url. 공용서버 배포 기준(localhost) — 개인 PC 개발 시: http://192.168.1.128:8087
    base-url: ${PATIENT_BASE_URL:http://localhost:8087}
  order:
    # 처방코어(OPD, outpatient-service) base-url. 공용서버 배포 기준(localhost) — 개인 PC 개발 시 application-local.yml 에서 덮어쓴다
    base-url: ${ORDER_BASE_URL:http://localhost:8088}
    # 응급의학과 코드(ADM DEPT_CD)
    department-code: "10"
    # 구두처방 verbalYn(Y/N)을 처방코어로 전달한다(2026-10-02 처방코어 안내). 문제가 생기면 false 로 끈다
    forward-verbal-yn: true
    # 약제(PHM) 연동 사용 여부(2026-10-07 처방코어·약제와 합의해 켬). false 면 약제 전송(등록 직후·POST /orders/{id}/dispatch-pharmacy)과 조제 상태 조회를 하지 않는다
    pharmacy-enabled: true
  pharmacy:
    # 약제(PHM) 서비스 base-url — 조제 상태 조회(GET /api/pharmacy/prescriptions?prescriptionId=)에 쓴다. 개인 PC 개발 시 application-local.yml 에서 덮어쓴다(개발 서버 http://192.168.1.125:8082)
    base-url: ${PHARMACY_BASE_URL:http://localhost:8082}
  reference-doc:
    # 응급 참고 문서 라이브러리(프로토콜·지침·서식 파일). 본문은 SeaweedFS S3 버킷, 목록은 응급 DB(REFERENCE_DOCUMENT)
    max-file-size-mb: 10
    storage:
      # SeaweedFS S3 게이트웨이. 공용서버 안에서는 localhost:8333 (프론트 /files 프록시와 같은 곳). 개인 PC 에서는 application-local.yml 로 덮어쓴다
      endpoint: ${SEAWEED_ENDPOINT:http://localhost:8333}
      bucket: ${REFERENCE_DOC_BUCKET:emergency-docs}
      region: us-east-1
      # S3 인증을 켜 둔 환경에서만 넣는다(환경변수로만 — 코드·저장소에 두지 않는다). 비우면 서명 없이 보낸다
      access-key: ${SEAWEED_ACCESS_KEY:}
      secret-key: ${SEAWEED_SECRET_KEY:}
  kafka:
    # 접수 이벤트 수신(Emergency-patient-daily-list 구독). 접수 연동을 켤 때만 true
    intake:
      enabled: true
      # 접수 이벤트 컨슈머 그룹(기본 emergency-service). 개발 PC가 공용 서버와 같은 브로커를 볼 때는 application-local.yml 에서 PC 전용 그룹으로 바꾼다
      group-id: emergency-service
      auto-offset-reset: earliest
    # 입원요청(응급→병동) Kafka 연동. 켤 때만 true(개인 PC 개발용 값은 application-local.yml 에 둔다). 토픽 기본값: emergency.admission.requested.v1 /
    # inpatient.admission.bed-assigned.v1 / inpatient.admission.rejected.v1 (app.kafka.admission.*-topic 으로 변경 가능)
    admission:
      enabled: true
    # 오접수·중복 접수(퇴실 유형 06)로 닫은 사실을 접수 서비스에 알리는 이벤트(응급→접수, 접수팀 합의 2026-10-08). 토픽은 응급이 만든다.
    # 닫았는데 접수가 아직 취소하지 않은 건은 resend 가 주기적으로 다시 보낸다(접수는 중복 이벤트에 안전). 끄려면 enabled: false
    void:
      enabled: true
      topic: emergency.reception.voided.v1
      resend:
        enabled: true
        interval-ms: 1800000
        max-age-hours: 24

spring:
  application:
    name: emergency-service
  servlet:
    multipart:
      # 참고 문서 업로드(기본 1MB 로는 PDF 도 못 올린다). app.reference-doc.max-file-size-mb 와 맞춘다
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import: optional:classpath:application-local.yml
  data:
    redis:
      # 공용서버 배포 기준(localhost) — 개인 PC 개발 시: 192.168.1.126
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:oracle:thin:@//seoulit.pe.kr:1521/FREEPDB1
    username: emergency
    password: "emergency"
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: EMERGENCY
  kafka:
    # 공용서버 배포 기준(localhost) — 개인 PC 개발 시: 192.168.1.126:9092
    bootstrap-servers: localhost:9092
    consumer:
      group-id: emergency-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: kr.co.seoulit.his.emergencyservice.care.messaging.dto
        spring.json.value.default.type: kr.co.seoulit.his.emergencyservice.care.messaging.dto.ReceptionIntakeEvent

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  packages-to-scan: kr.co.seoulit.his.emergencyservice
  paths-to-match: /api/**